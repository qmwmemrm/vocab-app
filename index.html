<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>단어장</title>
<style>
  :root {
    --bg: #FAFBFC; --border: #E2E5E9; --accent: #6B8CAE; --accent-light: #EEF2F6;
    --text: #2E333A; --muted: #9AA3AC; --good: #6FA37B; --good-light: #EEF5EF;
    --warn: #C0554D; --warn-light: #FBEEED;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: var(--bg); color: var(--text); padding: 26px 14px 90px;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 21px; font-weight: 600; margin: 0 0 14px; letter-spacing: -0.3px; }

  .lang-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .lang-tab {
    padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600;
    cursor: pointer; border: 1px solid var(--border); background: white; color: var(--muted); user-select: none;
  }
  .lang-tab.active { background: var(--accent); border-color: var(--accent); color: white; }

  .rule-box {
    background: var(--accent-light); border-radius: 8px; padding: 9px 12px; font-size: 11.5px;
    color: var(--text); margin-bottom: 14px; line-height: 1.5;
  }

  .top-toolbar { display: flex; gap: 8px; margin: 0 0 16px; flex-wrap: wrap; align-items: center; }
  .search-box {
    flex: 1; min-width: 160px; border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 12px; font-size: 13px; font-family: inherit; outline: none; background: white;
  }
  .search-box:focus { border-color: var(--accent); }
  button.main-btn {
    border: none; border-radius: 8px; padding: 9px 15px; font-size: 13px;
    font-weight: 500; cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  #addToday { background: var(--accent); color: white; }
  #addToday:hover { background: #5a7a9a; }
  #dailyQuiz { background: white; color: var(--text); border: 1px solid var(--border) !important; }
  #dailyQuiz:hover { background: var(--accent-light); }

  /* 월 폴더 */
  .month {
    background: white; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 14px; overflow: hidden;
  }
  .month-header {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    background: #F0F3F6; cursor: pointer; user-select: none;
  }
  .month.collapsed .month-body { display: none; }
  .m-arrow { font-size: 11px; color: var(--muted); transition: transform 0.15s; }
  .month.collapsed .m-arrow { transform: rotate(-90deg); }
  .month-title { font-size: 15px; font-weight: 700; flex: 1; }
  .month-meta { font-size: 11.5px; color: var(--muted); }
  .month-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 2px 4px; }
  .month-del:hover { color: var(--warn); }
  .month-body { padding: 10px 12px 12px; }

  /* 일별 세트 */
  .day {
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; overflow: hidden;
  }
  .day-header {
    display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: white; cursor: pointer; user-select: none;
  }
  .day.collapsed .day-body { display: none; }
  .d-arrow { font-size: 10px; color: var(--muted); transition: transform 0.15s; }
  .day.collapsed .d-arrow { transform: rotate(-90deg); }
  .day-title { font-size: 13px; font-weight: 700; flex: 1; }
  .day-meta { font-size: 11px; color: var(--muted); }
  .day-quiz-btn {
    font-size: 11px; padding: 3px 9px; border-radius: 12px; border: 1px solid var(--accent);
    background: white; color: var(--accent); cursor: pointer;
  }
  .day-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; padding: 2px 4px; }
  .day-del:hover { color: var(--warn); }
  .day-body { padding: 8px 10px 10px; }

  .filter-row { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; flex-wrap: wrap; }
  .filter-btn {
    font-size: 11px; padding: 4px 9px; border-radius: 14px; border: 1px solid var(--border);
    background: white; color: var(--muted); cursor: pointer;
  }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
  .reveal-btn {
    margin-left: auto; font-size: 11px; padding: 4px 9px; border-radius: 14px;
    border: 1px solid var(--border); background: white; color: var(--text); cursor: pointer;
  }

  table { width: 100%; border-collapse: collapse; }
  th { font-size: 11px; color: var(--muted); font-weight: 600; text-align: left; padding: 4px 6px; }
  th.num, td.num { width: 24px; text-align: center; }
  th.chk, td.chk { width: 100px; text-align: center; }
  th.del, td.del { width: 24px; }
  th.meaning, td.meaning { padding-left: 30px; }

  tbody tr { border-top: 1px solid var(--border); }
  tbody tr.mastered { background: var(--good-light); }
  td { padding: 0; vertical-align: middle; }
  td.num { text-align: center; font-size: 11px; color: var(--muted); padding: 5px 0; }

  td input[type="text"] {
    width: 100%; border: none; outline: none; padding: 6px 7px; font-size: 13.5px;
    background: transparent; color: var(--text); font-family: inherit;
  }
  td.word input { font-weight: 600; }
  td.pron input { color: #6B7683; font-size: 12px; }
  td.meaning { padding-left: 30px; }
  td.meaning.hidden-mode input { filter: blur(5px); cursor: pointer; }
  td.meaning.hidden-mode.revealed input { filter: none; }
  td input[type="text"]:focus { background: var(--accent-light); }

  .chk-btn {
    display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--border);
    background: white; color: var(--text); border-radius: 6px; padding: 3px 6px;
    font-size: 11px; cursor: pointer; font-family: inherit;
  }
  .chk-btn.checked-today { background: var(--good-light); border-color: var(--good); color: var(--good); }
  .dots { font-size: 9px; letter-spacing: 1px; color: var(--good); }
  .chk-wrap { display: inline-flex; align-items: center; gap: 4px; }
  .chk-minus {
    border: 1px solid var(--border); background: white; color: var(--warn);
    border-radius: 6px; width: 22px; height: 22px; font-size: 13px; line-height: 1;
    cursor: pointer; font-family: inherit; padding: 0;
  }
  .chk-minus:hover { background: var(--warn-light); }

  .del-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; padding: 3px; line-height: 1; }
  .del-btn:hover { color: var(--warn); }

  .add-row-btn {
    margin-top: 6px; font-size: 11.5px; background: none; border: 1px dashed var(--border);
    color: var(--muted); border-radius: 8px; padding: 6px; width: 100%; cursor: pointer; font-family: inherit;
  }
  .add-row-btn:hover { border-color: var(--accent); color: var(--accent); }

  .status { margin-top: 6px; font-size: 11px; color: var(--muted); text-align: right; }
  .empty-msg { padding: 22px 10px; text-align: center; color: var(--muted); font-size: 12.5px; }

  .carry-box {
    background: var(--warn-light); border: 1px solid #EBC9C5; border-radius: 8px;
    padding: 8px 10px; margin-bottom: 12px;
  }
  .carry-header { font-size: 11.5px; font-weight: 700; color: var(--warn); margin-bottom: 6px; }
  .carry-box table { background: transparent; }
  .carry-box tbody tr { border-top: 1px solid #F0D8D5; }
  .carry-icon { text-align: center; color: var(--warn); font-size: 11px; padding: 5px 0; }
  .carry-date { text-align: center; font-size: 10px; color: var(--muted); }

  /* 검색결과 */
  .search-result-item {
    background: white; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px;
    display: flex; align-items: center; gap: 10px; font-size: 13px;
  }
  .search-result-item .badge { font-size: 10.5px; color: var(--muted); white-space: nowrap; }
  .search-result-item b { font-weight: 700; }
  .search-result-item .meaning-txt { color: #55606A; margin-left: auto; }

  /* 퀴즈 모달 */
  .quiz-overlay {
    position: fixed; inset: 0; background: rgba(30,34,38,0.55); display: flex;
    align-items: center; justify-content: center; z-index: 100; padding: 20px;
  }
  .quiz-card {
    background: white; border-radius: 16px; padding: 28px 24px; max-width: 380px; width: 100%;
    text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  }
  .quiz-progress { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  .quiz-word { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
  .quiz-pron { font-size: 14px; color: var(--muted); margin-bottom: 18px; min-height: 18px; }
  .quiz-meaning {
    font-size: 17px; color: var(--accent); min-height: 40px; display: flex; align-items: center;
    justify-content: center; border: 1.5px dashed var(--border); border-radius: 10px; margin-bottom: 20px; padding: 10px;
    cursor: pointer;
  }
  .quiz-meaning.hidden-txt { color: var(--muted); }
  .quiz-btns { display: flex; gap: 8px; }
  .quiz-btn { flex: 1; border: none; border-radius: 10px; padding: 11px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .quiz-wrong { background: var(--warn-light); color: var(--warn); }
  .quiz-correct { background: var(--good-light); color: var(--good); }
  .quiz-close { margin-top: 16px; background: none; border: none; color: var(--muted); font-size: 12.5px; cursor: pointer; }
  .quiz-summary { font-size: 15px; line-height: 1.7; }
  .quiz-summary .big { font-size: 30px; font-weight: 700; color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>단어장</h1>
  <div class="lang-tabs" id="langTabs"></div>

  <div class="rule-box">
    월 폴더 안에 하루하루 세트가 쌓입니다. 뜻은 멀리 띄워두고 <b>뜻 가리기</b>로 흐리게 가릴 수 있어요.
    ㅇ 체크는 하루 1회만 카운트, 등록 2일 후 + 체크 3회 이상이면 초록색(암기완료)로 표시됩니다.
  </div>

  <div class="top-toolbar">
    <input type="text" class="search-box" id="searchBox" placeholder="단어·발음·뜻 검색">
    <button class="main-btn" id="addToday">+ 오늘 세트</button>
    <button class="main-btn" id="dailyQuiz">오늘의 복습 퀴즈</button>
    <button class="main-btn" id="exportBtn" title="전체 데이터를 파일로 저장">내보내기</button>
    <button class="main-btn" id="importBtn" title="내보낸 파일을 불러오기">가져오기</button>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
  </div>

  <div class="status" id="backupHint" style="text-align:left;margin-bottom:12px;">
    데이터 보호를 위해 가끔 <b>내보내기</b>로 백업 파일을 받아두세요.
  </div>

  <div id="setsContainer"></div>
  <div class="status" id="saveStatus"></div>
</div>

<div id="quizRoot"></div>

<script>
const STORAGE_KEY = "vocab-app-v4";
const MASTER_THRESHOLD = 3;
const GRACE_DAYS = 2;
const LANGS = [ { id: "en", label: "영어" }, { id: "ja", label: "일본어" } ];

let state = { en: { months: [] }, ja: { months: [] } };
let currentLang = "en";
let saveTimer = null;
let searchQuery = "";
let uiState = {}; // 세션 내 UI 상태 (collapsed, filter, revealAll) - id 기준

function uid() { return Math.random().toString(36).slice(2, 9); }
function todayStr() { return new Date().toISOString().slice(0,10); }
function daysSince(dateStr) { return Math.floor((new Date(todayStr()) - new Date(dateStr)) / 86400000); }
function isMastered(row) { return daysSince(row.addedDate) >= GRACE_DAYS && row.checkCount >= MASTER_THRESHOLD; }
function monthTitleOf(dateObj) { return `${dateObj.getFullYear()}년 ${dateObj.getMonth()+1}월`; }
function dayTitleOf(dateStr) {
  const d = new Date(dateStr);
  const days = ["일","월","화","수","목","금","토"];
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
}
function emptyRow() {
  return { id: uid(), word: "", pron: "", meaning: "", addedDate: todayStr(), checkCount: 0, lastCheckedDate: null };
}
function getUi(id, defaults) {
  if (!uiState[id]) uiState[id] = Object.assign({}, defaults);
  return uiState[id];
}

const SEED_IMPORT_JA_1 = [
  {w:"緊張", p:"", m:"긴장", c:0},
  {w:"中々", p:"なかなか", m:"꽤 상당히", c:0},
  {w:"こうふ", p:"", m:"노동자", c:0},
  {w:"食い込む", p:"くいこむ", m:"파고들다", c:0},
  {w:"川岸", p:"かわぎし", m:"강둑,강가", c:0},
  {w:"せっけん", p:"", m:"비누", c:0},
  {w:"歩く", p:"あるく", m:"걷다", c:0},
  {w:"着飾る", p:"きかざる", m:"치장하다", c:1},
  {w:"ショップ", p:"", m:"상점", c:0},
  {w:"入る", p:"", m:"들어가다", c:0},
  {w:"再三", p:"さいさん", m:"거듭거듭, 재차", c:0},
  {w:"朗報", p:"ろうほう", m:"희소식", c:0},
  {w:"失恋", p:"", m:"실연", c:0},
  {w:"判断", p:"", m:"판단", c:0},
  {w:"町", p:"まち", m:"마을", c:0},
  {w:"農場", p:"のうじょう", m:"농장", c:0},
  {w:"合計", p:"ごうけい", m:"총액", c:0},
  {w:"結局", p:"けっきょく", m:"결국", c:0},
  {w:"冷たい", p:"つめ", m:"차가운", c:0},
  {w:"諭す", p:"さと", m:"타이르다", c:0},
  {w:"", p:"ほんとう", m:"정말로", c:0},
  {w:"文語", p:"ぶんご", m:"문어체", c:0},
  {w:"キャリア", p:"", m:"경력,공무원", c:0},
  {w:"再発", p:"さいはつ", m:"재발", c:0},
  {w:"影響", p:"えいきょう", m:"영향", c:0},
  {w:"舗装", p:"ほそう", m:"포장,도로표면", c:0},
  {w:"留まる", p:"とまる", m:"머물다", c:0},
  {w:"つける", p:"", m:"켜다,붙이다", c:1},
  {w:"止す", p:"よ", m:"그만두다", c:0},
  {w:"贅沢", p:"ぜいたく", m:"사치", c:2},
  {w:"両親", p:"りょうしん", m:"부모", c:0},
  {w:"要る", p:"い", m:"필요하다", c:0},
  {w:"完結", p:"かんけつ", m:"완료", c:0},
  {w:"終わらせる", p:"お", m:"끝내다", c:1},
  {w:"蹴る", p:"け", m:"차다", c:2},
  {w:"オダ", p:"", m:"주문", c:0},
  {w:"逞しい", p:"たくま", m:"튼튼한", c:0},
  {w:"潜伏", p:"せんぷく", m:"잠복", c:0},
  {w:"不明", p:"ふめい", m:"불명확", c:0},
  {w:"経験者", p:"けいけんしゃ", m:"경험자", c:0},
  {w:"取り戻す", p:"とりもどす", m:"되찾다", c:1},
  {w:"文句", p:"もんく", m:"불평", c:0},
  {w:"反映", p:"はんえい", m:"반영", c:0},
  {w:"咲く", p:"さく", m:"꽃이피다", c:0},
  {w:"後半", p:"こうはん", m:"후반", c:0},
  {w:"ひそひそ", p:"", m:"소곤소곤", c:0},
  {w:"尋ねる", p:"たずねる", m:"묻다", c:1},
  {w:"申し訳ない", p:"", m:"죄송한", c:0},
  {w:"陳列", p:"", m:"진열", c:0}
];

function runSeedImportOnce() {
  if (state._seedJa1) return false;
  const day = findOrCreateTodayDay("ja");
  // 자동 생성된 빈 줄 3개는 비우고 시작
  day.rows = day.rows.filter(r => r.word || r.pron || r.meaning);
  SEED_IMPORT_JA_1.forEach(item => {
    day.rows.push({
      id: uid(), word: item.w, pron: item.p, meaning: item.m,
      addedDate: todayStr(), checkCount: item.c, lastCheckedDate: null
    });
  });
  state._seedJa1 = true;
  return true;
}

const SEED_IMPORT_JA_2 = [
  {w:"簡易", p:"かんい", m:"간편함", c:0},
  {w:"落し物", p:"おとしもの", m:"분실물", c:0},
  {w:"かぎ", p:"", m:"열쇠", c:0},
  {w:"それゆえ", p:"", m:"그러므로,따라서", c:0},
  {w:"目安", p:"めやす", m:"기준,목표", c:0},
  {w:"半分", p:"はんぶん", m:"절반", c:0},
  {w:"非常", p:"ひじょう", m:"비상", c:0},
  {w:"満員", p:"まんいん", m:"만석,만원", c:0},
  {w:"ちょうど", p:"", m:"정확히,딱", c:0}
];

function runSeedImportOnce2() {
  if (state._seedJa2) return false;
  const day = findOrCreateTodayDay("ja");
  SEED_IMPORT_JA_2.forEach(item => {
    day.rows.push({
      id: uid(), word: item.w, pron: item.p, meaning: item.m,
      addedDate: todayStr(), checkCount: item.c, lastCheckedDate: null
    });
  });
  state._seedJa2 = true;
  return true;
}

function runResetAllChecksOnce() {
  if (state._resetChecks1) return false;
  LANGS.forEach(l => {
    state[l.id].months.forEach(m => m.days.forEach(d => d.rows.forEach(r => {
      r.checkCount = 0;
      r.lastCheckedDate = null;
    })));
  });
  state._resetChecks1 = true;
  return true;
}

// 로컬 파일로 다운로드해서 쓰는 방식이므로, 브라우저 내장 localStorage에 저장합니다.
// (Claude 안에서만 동작하는 window.storage는 사용하지 않음 - file:// 에서도 정상 작동)
const localDB = {
  get(key) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? { value: raw } : null;
    } catch (e) { return null; }
  },
  set(key, value) {
    try {
      localStorage.setItem(key, value);
      return true;
    } catch (e) { throw e; }
  }
};

async function load() {
  try {
    const res = localDB.get(STORAGE_KEY);
    if (res && res.value) state = JSON.parse(res.value);
  } catch (e) {}
  LANGS.forEach(l => { if (!state[l.id]) state[l.id] = { months: [] }; });
  const imported = runSeedImportOnce();
  const imported2 = runSeedImportOnce2();
  const wasReset = runResetAllChecksOnce();
  if (imported) { currentLang = "ja"; }
  if (imported || imported2 || wasReset) { scheduleSave(); }
  renderLangTabs();
  renderMain();
}

function scheduleSave() {
  const el = document.getElementById("saveStatus");
  el.textContent = "저장 중...";
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localDB.set(STORAGE_KEY, JSON.stringify(state));
      el.textContent = "저장됨 (이 브라우저에)";
    } catch (e) { el.textContent = "저장 실패 - 브라우저 저장공간을 확인해주세요"; }
  }, 400);
}

function renderLangTabs() {
  const box = document.getElementById("langTabs");
  box.innerHTML = "";
  LANGS.forEach(l => {
    const tab = document.createElement("div");
    tab.className = "lang-tab" + (l.id === currentLang ? " active" : "");
    tab.textContent = l.label;
    tab.addEventListener("click", () => { currentLang = l.id; searchQuery = ""; document.getElementById("searchBox").value = ""; renderLangTabs(); renderMain(); });
    box.appendChild(tab);
  });
}

function findOrCreateTodayDay(langId) {
  langId = langId || currentLang;
  const lang = state[langId];
  const mTitle = monthTitleOf(new Date());
  let month = lang.months.find(m => m.title === mTitle);
  if (!month) {
    month = { id: uid(), title: mTitle, days: [] };
    lang.months.unshift(month);
  }
  let day = month.days.find(d => d.date === todayStr());
  if (!day) {
    day = { id: uid(), date: todayStr(), rows: [emptyRow(), emptyRow(), emptyRow()] };
    month.days.unshift(day);
  }
  getUi(month.id, { collapsed: false }).collapsed = false;
  getUi(day.id, { collapsed: false, filter: "all", revealAll: false }).collapsed = false;
  return day;
}

document.getElementById("addToday").addEventListener("click", () => {
  findOrCreateTodayDay(currentLang);
  renderMain();
  scheduleSave();
});

document.getElementById("searchBox").addEventListener("input", e => {
  searchQuery = e.target.value.trim();
  renderMain();
});

document.getElementById("dailyQuiz").addEventListener("click", () => {
  const lang = state[currentLang];
  let allRows = [];
  lang.months.forEach(m => m.days.forEach(d => d.rows.forEach(r => { if (r.word || r.meaning) allRows.push(r); })));
  const studyRows = allRows.filter(r => !isMastered(r));
  const pool = studyRows.length > 0 ? studyRows : allRows;
  if (pool.length === 0) { alert("퀴즈할 단어가 없어요. 먼저 단어를 추가해주세요."); return; }
  startQuiz(pool);
});

document.getElementById("exportBtn").addEventListener("click", () => {
  const payload = {
    exportedAt: new Date().toISOString(),
    app: "단어장",
    data: state
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const dateTag = todayStr().replace(/-/g, "");
  a.href = url;
  a.download = `단어장_백업_${dateTag}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

document.getElementById("importBtn").addEventListener("click", () => {
  document.getElementById("importFile").click();
});

document.getElementById("importFile").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const parsed = JSON.parse(ev.target.result);
      const incoming = parsed.data || parsed; // 구버전 호환
      if (!incoming || (!incoming.en && !incoming.ja)) {
        alert("올바른 백업 파일이 아니에요.");
        return;
      }
      const mode = confirm(
        "확인 = 지금 데이터에 이어붙이기 (기존 데이터 유지)\n취소 = 백업 파일로 완전히 덮어쓰기 (기존 데이터 삭제됨)"
      );
      if (mode) {
        // 이어붙이기: 언어별로 월(month) 단위 merge, 같은 제목의 월이 있으면 그 안에 day를 합침
        LANGS.forEach(l => {
          if (!incoming[l.id]) return;
          if (!state[l.id]) state[l.id] = { months: [] };
          incoming[l.id].months.forEach(inMonth => {
            let existMonth = state[l.id].months.find(m => m.title === inMonth.title);
            if (!existMonth) {
              existMonth = { id: uid(), title: inMonth.title, days: [] };
              state[l.id].months.push(existMonth);
            }
            inMonth.days.forEach(inDay => {
              let existDay = existMonth.days.find(d => d.date === inDay.date);
              if (!existDay) {
                existDay = { id: uid(), date: inDay.date, rows: [] };
                existMonth.days.push(existDay);
              }
              inDay.rows.forEach(r => existDay.rows.push(Object.assign({}, r, { id: uid() })));
            });
          });
        });
      } else {
        LANGS.forEach(l => { state[l.id] = incoming[l.id] || { months: [] }; });
      }
      renderLangTabs();
      renderMain();
      scheduleSave();
      alert("가져오기가 완료됐어요.");
    } catch (err) {
      alert("파일을 읽는 중 문제가 생겼어요. JSON 형식을 확인해주세요.");
    }
    e.target.value = "";
  };
  reader.readAsText(file);
});

function renderMain() {
  if (searchQuery) { renderSearchResults(); return; }
  renderMonths();
}

function renderSearchResults() {
  const container = document.getElementById("setsContainer");
  container.innerHTML = "";
  const lang = state[currentLang];
  const q = searchQuery.toLowerCase();
  let results = [];
  lang.months.forEach(m => m.days.forEach(d => d.rows.forEach(r => {
    if ((r.word && r.word.toLowerCase().includes(q)) ||
        (r.pron && r.pron.toLowerCase().includes(q)) ||
        (r.meaning && r.meaning.toLowerCase().includes(q))) {
      results.push({ row: r, monthTitle: m.title, dayTitle: dayTitleOf(d.date) });
    }
  })));
  if (results.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty-msg";
    empty.textContent = "검색 결과가 없어요.";
    container.appendChild(empty);
    return;
  }
  results.forEach(({row, monthTitle, dayTitle}) => {
    const item = document.createElement("div");
    item.className = "search-result-item";
    item.innerHTML = `<b>${row.word || "(단어없음)"}</b>
      <span style="color:#6B7683;font-size:12px;">${row.pron || ""}</span>
      <span class="meaning-txt">${row.meaning || ""}</span>
      <span class="badge">${monthTitle} · ${dayTitle}</span>`;
    container.appendChild(item);
  });
}

function buildChkCell(row) {
  const tdChk = document.createElement("td"); tdChk.className = "chk";
  const wrap = document.createElement("div"); wrap.className = "chk-wrap";

  const minusBtn = document.createElement("button");
  minusBtn.className = "chk-minus";
  minusBtn.textContent = "－";
  minusBtn.title = "체크 1 감소 (잘못 눌렀을 때)";
  minusBtn.addEventListener("click", () => {
    row.checkCount = Math.max(0, row.checkCount - 1);
    row.lastCheckedDate = null;
    renderMain(); scheduleSave();
  });
  wrap.appendChild(minusBtn);

  const chkBtn = document.createElement("button");
  chkBtn.className = "chk-btn";
  const checkedToday = row.lastCheckedDate === todayStr();
  if (checkedToday) chkBtn.classList.add("checked-today");
  chkBtn.innerHTML = `ㅇ <span class="dots">${row.checkCount > 0 ? "●".repeat(Math.min(row.checkCount,5)) : ""}</span><span style="color:var(--muted)">${row.checkCount}</span>`;
  chkBtn.addEventListener("click", () => {
    if (row.lastCheckedDate !== todayStr()) { row.checkCount += 1; row.lastCheckedDate = todayStr(); }
    renderMain(); scheduleSave();
  });
  wrap.appendChild(chkBtn);

  tdChk.appendChild(wrap);
  return tdChk;
}

function renderCarryoverBlock(langId, beforeDate) {
  const lang = state[langId];
  let items = [];
  lang.months.forEach(m => m.days.forEach(d => {
    if (d.date < beforeDate) {
      d.rows.forEach(r => {
        if ((r.word || r.meaning) && !isMastered(r)) items.push({ row: r, date: d.date });
      });
    }
  }));
  if (items.length === 0) return null;
  items.sort((a,b) => a.date.localeCompare(b.date));

  const box = document.createElement("div");
  box.className = "carry-box";

  const header = document.createElement("div");
  header.className = "carry-header";
  header.textContent = `아직 다 못외운 단어 ${items.length}개 (이전 세트에서 이어옴)`;
  box.appendChild(header);

  const table = document.createElement("table");
  table.innerHTML = `<thead><tr>
    <th style="width:18px;"></th><th>단어</th><th>발음</th><th class="meaning">뜻</th>
    <th style="width:46px;">날짜</th><th class="chk">체크</th></tr></thead>`;
  const tbody = document.createElement("tbody");

  items.forEach(({row, date}) => {
    const tr = document.createElement("tr");
    if (isMastered(row)) tr.classList.add("mastered");

    const tdIcon = document.createElement("td");
    tdIcon.className = "carry-icon";
    tdIcon.textContent = "↑";
    tr.appendChild(tdIcon);

    const tdWord = document.createElement("td"); tdWord.className = "word";
    const wordInput = document.createElement("input");
    wordInput.type = "text"; wordInput.value = row.word; wordInput.placeholder = "단어";
    wordInput.addEventListener("input", e => { row.word = e.target.value; scheduleSave(); });
    tdWord.appendChild(wordInput); tr.appendChild(tdWord);

    const tdPron = document.createElement("td"); tdPron.className = "pron";
    const pronInput = document.createElement("input");
    pronInput.type = "text"; pronInput.value = row.pron;
    pronInput.addEventListener("input", e => { row.pron = e.target.value; scheduleSave(); });
    tdPron.appendChild(pronInput); tr.appendChild(tdPron);

    const tdMeaning = document.createElement("td"); tdMeaning.className = "meaning";
    const meaningInput = document.createElement("input");
    meaningInput.type = "text"; meaningInput.value = row.meaning; meaningInput.placeholder = "뜻";
    meaningInput.addEventListener("input", e => { row.meaning = e.target.value; scheduleSave(); });
    tdMeaning.appendChild(meaningInput); tr.appendChild(tdMeaning);

    const tdDate = document.createElement("td"); tdDate.className = "carry-date";
    tdDate.textContent = date.slice(5).replace("-", "/");
    tr.appendChild(tdDate);

    tr.appendChild(buildChkCell(row));

    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  box.appendChild(table);
  return box;
}

function renderMonths() {
  const container = document.getElementById("setsContainer");
  container.innerHTML = "";
  const months = state[currentLang].months;

  if (months.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty-msg";
    empty.textContent = "아직 세트가 없어요. '+ 오늘 세트'로 시작해보세요.";
    container.appendChild(empty);
    return;
  }

  months.forEach(month => {
    const mUi = getUi(month.id, { collapsed: false });
    const monthEl = document.createElement("div");
    monthEl.className = "month" + (mUi.collapsed ? " collapsed" : "");

    const header = document.createElement("div");
    header.className = "month-header";
    const arrow = document.createElement("span");
    arrow.className = "m-arrow"; arrow.textContent = "▾";
    header.appendChild(arrow);

    const titleEl = document.createElement("div");
    titleEl.className = "month-title";
    titleEl.textContent = month.title;
    header.appendChild(titleEl);

    const totalWords = month.days.reduce((s,d) => s + d.rows.length, 0);
    const masteredWords = month.days.reduce((s,d) => s + d.rows.filter(isMastered).length, 0);
    const meta = document.createElement("span");
    meta.className = "month-meta";
    meta.textContent = `${month.days.length}일 · ${masteredWords}/${totalWords} 암기`;
    header.appendChild(meta);

    const mDel = document.createElement("button");
    mDel.className = "month-del"; mDel.textContent = "✕";
    mDel.addEventListener("click", e => {
      e.stopPropagation();
      if (confirm(`"${month.title}" 폴더 전체를 삭제할까요?`)) {
        state[currentLang].months = state[currentLang].months.filter(m => m.id !== month.id);
        renderMain(); scheduleSave();
      }
    });
    header.appendChild(mDel);
    header.addEventListener("click", () => { mUi.collapsed = !mUi.collapsed; renderMain(); });
    monthEl.appendChild(header);

    const mBody = document.createElement("div");
    mBody.className = "month-body";

    if (month.days.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty-msg";
      empty.textContent = "이 달에는 아직 세트가 없어요.";
      mBody.appendChild(empty);
    }

    month.days.forEach(day => {
      const dUi = getUi(day.id, { collapsed: false, filter: "all", revealAll: false });
      const dayEl = document.createElement("div");
      dayEl.className = "day" + (dUi.collapsed ? " collapsed" : "");

      const dHeader = document.createElement("div");
      dHeader.className = "day-header";
      const dArrow = document.createElement("span");
      dArrow.className = "d-arrow"; dArrow.textContent = "▾";
      dHeader.appendChild(dArrow);

      const dTitle = document.createElement("div");
      dTitle.className = "day-title";
      dTitle.textContent = dayTitleOf(day.date);
      dHeader.appendChild(dTitle);

      const dMeta = document.createElement("span");
      dMeta.className = "day-meta";
      const dMastered = day.rows.filter(isMastered).length;
      dMeta.textContent = `${dMastered}/${day.rows.length}`;
      dHeader.appendChild(dMeta);

      const quizBtn = document.createElement("button");
      quizBtn.className = "day-quiz-btn";
      quizBtn.textContent = "퀴즈";
      quizBtn.addEventListener("click", e => {
        e.stopPropagation();
        const rows = day.rows.filter(r => r.word || r.meaning);
        if (rows.length === 0) { alert("이 세트에 단어가 없어요."); return; }
        startQuiz(rows);
      });
      dHeader.appendChild(quizBtn);

      const dDel = document.createElement("button");
      dDel.className = "day-del"; dDel.textContent = "✕";
      dDel.addEventListener("click", e => {
        e.stopPropagation();
        if (confirm(`${dayTitleOf(day.date)} 세트를 삭제할까요?`)) {
          month.days = month.days.filter(d => d.id !== day.id);
          renderMain(); scheduleSave();
        }
      });
      dHeader.appendChild(dDel);

      dHeader.addEventListener("click", () => { dUi.collapsed = !dUi.collapsed; renderMain(); });
      dayEl.appendChild(dHeader);

      const dBody = document.createElement("div");
      dBody.className = "day-body";

      if (day.date === todayStr()) {
        const carryBlock = renderCarryoverBlock(currentLang, day.date);
        if (carryBlock) dBody.appendChild(carryBlock);
      }

      const filterRow = document.createElement("div");
      filterRow.className = "filter-row";
      [["all","전체"],["study","학습중"],["mastered","암기완료"]].forEach(([key,label]) => {
        const btn = document.createElement("button");
        btn.className = "filter-btn" + (dUi.filter === key ? " active" : "");
        btn.textContent = label;
        btn.addEventListener("click", () => { dUi.filter = key; renderMain(); });
        filterRow.appendChild(btn);
      });
      const revealBtn = document.createElement("button");
      revealBtn.className = "reveal-btn";
      revealBtn.textContent = dUi.revealAll ? "뜻 가리기 켜기" : "뜻 가리기 끄기";
      revealBtn.addEventListener("click", () => { dUi.revealAll = !dUi.revealAll; renderMain(); });
      filterRow.appendChild(revealBtn);
      dBody.appendChild(filterRow);

      const table = document.createElement("table");
      table.innerHTML = `<thead><tr>
        <th class="num">#</th><th>단어</th><th>발음</th><th class="meaning">뜻</th>
        <th class="chk">체크</th><th class="del"></th></tr></thead>`;
      const tbody = document.createElement("tbody");

      let visibleRows = day.rows;
      if (dUi.filter === "study") visibleRows = day.rows.filter(r => !isMastered(r));
      if (dUi.filter === "mastered") visibleRows = day.rows.filter(isMastered);

      if (visibleRows.length === 0) {
        const emptyMsg = document.createElement("div");
        emptyMsg.className = "empty-msg";
        emptyMsg.textContent = "해당하는 단어가 없어요.";
        dBody.appendChild(table);
        dBody.appendChild(emptyMsg);
      } else {
        visibleRows.forEach(row => {
          const globalIdx = day.rows.indexOf(row);
          const tr = document.createElement("tr");
          if (isMastered(row)) tr.classList.add("mastered");

          const tdNum = document.createElement("td");
          tdNum.className = "num"; tdNum.textContent = globalIdx + 1;
          tr.appendChild(tdNum);

          const tdWord = document.createElement("td"); tdWord.className = "word";
          const wordInput = document.createElement("input");
          wordInput.type = "text"; wordInput.value = row.word; wordInput.placeholder = "단어";
          wordInput.addEventListener("input", e => { row.word = e.target.value; scheduleSave(); });
          tdWord.appendChild(wordInput); tr.appendChild(tdWord);

          const tdPron = document.createElement("td"); tdPron.className = "pron";
          const pronInput = document.createElement("input");
          pronInput.type = "text"; pronInput.value = row.pron;
          pronInput.addEventListener("input", e => { row.pron = e.target.value; scheduleSave(); });
          tdPron.appendChild(pronInput); tr.appendChild(tdPron);

          const tdMeaning = document.createElement("td"); tdMeaning.className = "meaning";
          if (dUi.revealAll) {
            tdMeaning.classList.add("hidden-mode");
            if (row._revealed) tdMeaning.classList.add("revealed");
          }
          const meaningInput = document.createElement("input");
          meaningInput.type = "text"; meaningInput.value = row.meaning; meaningInput.placeholder = "뜻";
          meaningInput.addEventListener("input", e => { row.meaning = e.target.value; scheduleSave(); });
          if (dUi.revealAll) {
            meaningInput.addEventListener("click", e => {
              if (!row._revealed) { row._revealed = true; renderMain(); e.preventDefault(); e.target.blur(); }
            });
          }
          tdMeaning.appendChild(meaningInput); tr.appendChild(tdMeaning);

          tr.appendChild(buildChkCell(row));

          const tdDel = document.createElement("td"); tdDel.className = "del";
          const delBtn = document.createElement("button");
          delBtn.className = "del-btn"; delBtn.textContent = "✕";
          delBtn.addEventListener("click", () => {
            day.rows = day.rows.filter(r => r.id !== row.id);
            renderMain(); scheduleSave();
          });
          tdDel.appendChild(delBtn); tr.appendChild(tdDel);

          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        dBody.appendChild(table);
      }

      const addRowBtn = document.createElement("button");
      addRowBtn.className = "add-row-btn";
      addRowBtn.textContent = "+ 단어 추가";
      addRowBtn.addEventListener("click", () => {
        day.rows.push(emptyRow());
        renderMain(); scheduleSave();
        setTimeout(() => {
          const inputs = document.querySelectorAll("tbody tr:last-child input[type=text]");
          if (inputs[0]) inputs[0].focus();
        }, 0);
      });
      dBody.appendChild(addRowBtn);

      dayEl.appendChild(dBody);
      mBody.appendChild(dayEl);
    });

    monthEl.appendChild(mBody);
    container.appendChild(monthEl);
  });
}

/* ===== 퀴즈 모드 ===== */
function markQuizCorrect(row) {
  if (row.lastCheckedDate !== todayStr()) {
    row.checkCount += 1;
    row.lastCheckedDate = todayStr();
  }
}
function markQuizWrong(row) {
  row.checkCount = Math.max(0, row.checkCount - 1);
}

function startQuiz(rows) {
  const shuffled = [...rows].sort(() => Math.random() - 0.5);
  let idx = 0;
  let correctCount = 0;
  let revealed = false;

  const root = document.getElementById("quizRoot");

  function renderCard() {
    if (idx >= shuffled.length) {
      root.innerHTML = `<div class="quiz-overlay">
        <div class="quiz-card">
          <div class="quiz-summary">
            수고하셨어요!<br>
            <span class="big">${correctCount} / ${shuffled.length}</span><br>
            정답
          </div>
          <button class="quiz-btn quiz-correct" id="quizDone" style="margin-top:16px;width:100%;">완료</button>
        </div>
      </div>`;
      document.getElementById("quizDone").addEventListener("click", () => { root.innerHTML = ""; scheduleSave(); renderMain(); });
      return;
    }
    const row = shuffled[idx];
    revealed = false;
    root.innerHTML = `<div class="quiz-overlay">
      <div class="quiz-card">
        <div class="quiz-progress">${idx+1} / ${shuffled.length}</div>
        <div class="quiz-word">${row.word || "(단어없음)"}</div>
        <div class="quiz-pron">${row.pron || ""}</div>
        <div class="quiz-meaning hidden-txt" id="qMeaning">뜻 보기 (탭)</div>
        <div class="quiz-btns">
          <button class="quiz-btn quiz-wrong" id="qWrong">몰라요</button>
          <button class="quiz-btn quiz-correct" id="qCorrect">맞았어요</button>
        </div>
        <button class="quiz-close" id="qClose">퀴즈 종료</button>
      </div>
    </div>`;
    document.getElementById("qMeaning").addEventListener("click", () => {
      revealed = true;
      const el = document.getElementById("qMeaning");
      el.textContent = row.meaning || "(뜻 없음)";
      el.classList.remove("hidden-txt");
    });
    document.getElementById("qCorrect").addEventListener("click", () => {
      markQuizCorrect(row); correctCount++; idx++; renderCard();
    });
    document.getElementById("qWrong").addEventListener("click", () => {
      markQuizWrong(row); idx++; renderCard();
    });
    document.getElementById("qClose").addEventListener("click", () => {
      root.innerHTML = ""; scheduleSave(); renderMain();
    });
  }
  renderCard();
}

load();
</script>
